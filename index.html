<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HELPIE · Portal Kesejahteraan Pelajar</title>
  <meta name="description" content="HELPIE: Student Wellbeing Portal. Explore emotions, play educational games, and share your feelings with caring teachers and counselors.">
  <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1626" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HELPIE">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme before first paint so the page does not flash.
    try { var t = localStorage.getItem('helpie-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="js/portal-content.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/apk.js" defer></script>
  <script src="js/portal.js" defer></script>
  <script src="js/admin.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Langkau ke kandungan</a>

  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="topbar-brand" href="#/">
      <img src="img/logo.webp" alt="" width="36" height="36">
      <span>HELPIE</span>
    </a>
    <button class="icon-btn lang-toggle" type="button">EN</button>
    <button class="icon-btn theme-btn" type="button">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <a class="brand" href="#/">
      <span class="brand-logo"><img src="img/logo.webp" alt="" width="56" height="56"></span>
      <span>
        <span class="brand-name">HELPIE</span>
        <span class="brand-sub">Portal Kesejahteraan Pelajar</span>
      </span>
    </a>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="segmented wide" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang="bm" aria-pressed="true">Bahasa Melayu</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <button class="pill-btn theme-btn" type="button">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-label">Mod gelap</span>
      </button>
      <button class="pill-btn" id="install-btn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        <span>Tambah ke skrin utama</span>
      </button>
      <a class="pill-btn" id="staff-link" href="#/staff">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Log masuk staf</span>
      </a>
    </div>
  </aside>

  <main id="main" tabindex="-1"></main>

  <noscript><p style="padding:24px">HELPIE perlukan JavaScript. HELPIE needs JavaScript turned on.</p></noscript>
</body>
</html>
